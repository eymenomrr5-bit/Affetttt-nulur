<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart For Her</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #title {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            pointer-events: none;
            z-index: 10;
        }
        #sub-title {
            position: absolute;
            top: 25%;
            width: 100%;
            text-align: center;
            color: #ffb6c1;
            font-size: 0.9rem;
            opacity: 0.8;
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="title">Love Heart For Her</div>
    <div id="sub-title">this is for you</div>

    <!-- Three.js ve OrbitControls yükleniyor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Sahne ve Kamera Kurulumu
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Kalp Parçacıkları Oluşturma
        const count = 3500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const scales = new Float32Array(count);
        const speeds = new Float32Array(count);

        const colorChoices = ['#ff0055', '#ff1493', '#ff69b4', '#ffb6c1', '#ffffff'];
        const parameters = { max: 0.02 };

        // Kalp Matematiksel Formülü
        for (let i = 0; i < count; i++) {
            // Kalp şekli koordinatları
            const t = Math.random() * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            let z = (Math.random() - 0.5) * 8;

            // Rastgele dağılım ekle
            const scatter = 0.4;
            x += (Math.random() - 0.5) * scatter * 10;
            y += (Math.random() - 0.5) * scatter * 10;
            z += (Math.random() - 0.5) * scatter * 10;

            positions[i * 3] = x * 0.8;
            positions[i * 3 + 1] = y * 0.8;
            positions[i * 3 + 2] = z * 0.8;

            // Renk ve Boyut
            const colorIndex = Math.floor(Math.random() * colorChoices.length);
            const color = new THREE.Color(colorChoices[colorIndex]);

            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;

            scales[i] = Math.random() * 0.35;
            speeds[i] = Math.random() * parameters.max;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Nokta Materyali
        const material = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 3. Animasyon Döngüsü
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Dönüş ve Nabız Hareketi (Kalp Atışı)
            particles.rotation.y = elapsedTime * 0.2;
            const pulse = 1 + Math.sin(elapsedTime * 3) * 0.08;
            particles.scale.set(pulse, pulse, pulse);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Ekran Boyutu Değişirse Yeniden Boyutlandır
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
